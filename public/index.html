<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KILLIX</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:system-ui}.wrap{max-width:520px;margin:auto;padding:28px}.logo{font-size:44px;font-weight:900;text-align:center;margin:45px 0 24px}.card{background:#141821;border:1px solid #252b38;padding:22px;border-radius:20px}input,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #303746;background:#0d1118;color:#fff;font-size:16px}button{background:#316dff;border:0;font-weight:700}.link{background:none;color:#8fb1ff}.err{color:#ff7b7b}.coin{font-size:34px;font-weight:900}.small{color:#9ca6b8;font-size:14px}.hide{display:none}</style></head>
<body><div class="wrap"><div class="logo">KILLIX</div>
<div id="auth" class="card"><div id="login"><h2>Kirish</h2><input id="li" placeholder="Username yoki email"><input id="lp" type="password" placeholder="Parol"><button onclick="login()">Kirish</button><button class="link" onclick="reg(true)">Akkaunt yaratish</button></div>
<div id="register" class="hide"><h2>Akkaunt yaratish</h2><input id="ru" placeholder="Username"><input id="re" type="email" placeholder="Email"><input id="rp" type="password" placeholder="Parol"><input id="rc" type="password" placeholder="Parolni qayta yozing"><input id="rr" placeholder="Referral kodi (ixtiyoriy)"><button onclick="create()">Akkaunt yaratish</button><button class="link" onclick="reg(false)">Kirishga qaytish</button></div><div id="err" class="err"></div></div>
<div id="dash" class="card hide"><h2 id="hello"></h2><div class="small">Hisobingiz</div><div class="coin"><span id="coins"></span> coin</div><button onclick="daily()">Bugungi +4 coin olish</button><hr><div class="small">Referral kodingiz</div><h2 id="ref"></h2><div class="small">Do‘stingiz akkaunt ochayotganda shu kodni yozsa, sizga 100 coin qo‘shiladi.</div><button class="link" onclick="logout()">Chiqish</button><div id="msg"></div></div></div>
<script>const $=x=>document.getElementById(x);async function A(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o}),d=await r.json();if(!r.ok)throw Error(d.error);return d}function reg(x){$("login").classList.toggle("hide",x);$("register").classList.toggle("hide",!x);$("err").textContent=""}function show(u){$("auth").classList.add("hide");$("dash").classList.remove("hide");$("hello").textContent="Salom, "+u.username;$("coins").textContent=u.coins;$("ref").textContent=u.referral_code}async function login(){try{show((await A("/api/login",{method:"POST",body:JSON.stringify({login:li.value,password:lp.value})})).user)}catch(e){err.textContent=e.message}}async function create(){try{show((await A("/api/register",{method:"POST",body:JSON.stringify({username:ru.value,email:re.value,password:rp.value,confirm:rc.value,referral:rr.value})})).user)}catch(e){err.textContent=e.message}}async function daily(){try{let d=await A("/api/daily",{method:"POST"});show(d.user);msg.textContent="+4 coin qo‘shildi"}catch(e){msg.textContent=e.message}}async function logout(){await A("/api/logout",{method:"POST"});location.reload()}A("/api/me").then(d=>show(d.user)).catch(()=>{});</script></body></html>
