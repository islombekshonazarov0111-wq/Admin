<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KILLIX Admin</title><style>*{box-sizing:border-box}body{font-family:system-ui;background:#090b10;color:white;margin:0;padding:20px}main{max-width:1100px;margin:auto}.card{background:#141821;padding:18px;border-radius:16px;margin:14px 0;overflow:auto}input,button{padding:11px;border-radius:10px;border:1px solid #343b4a;background:#0d1118;color:white;margin:3px}button{background:#316dff}table{width:100%;border-collapse:collapse;min-width:800px}td,th{padding:10px;border-bottom:1px solid #2a303c;text-align:left}.hide{display:none}.stats{font-size:20px;font-weight:700}</style></head><body><main><h1>KILLIX Admin</h1><div id=l class=card><input id=u placeholder=Admin><input id=p type=password placeholder=Parol><button onclick=login()>Kirish</button><span id=e></span></div><div id=d class=hide><div class=card><span id=s class=stats></span> <button onclick=logout()>Chiqish</button></div><div class=card><input id=q placeholder="Username/email qidirish" oninput=users()><table><thead><tr><th>User</th><th>Email</th><th>Coin</th><th>Referral</th><th>Holat</th><th>Coin +/-</th><th>Blok</th></tr></thead><tbody id=t></tbody></table></div></div></main><script>async function A(x,o={}){let r=await fetch(x,{headers:{"Content-Type":"application/json"},...o}),j=await r.json();if(!r.ok)throw Error(j.error);return j}async function login(){try{await A("/api/admin/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});open()}catch(x){e.textContent=x.message}}async function open(){l.classList.add("hide");d.classList.remove("hide");let x=await A("/api/admin/stats");s.textContent=`User: ${x.users} | Coin: ${x.coins} | Referral: ${x.referrals} | Blok: ${x.blocked}`;users()}async function users(){let a=await A("/api/admin/users?q="+encodeURIComponent(q.value));t.innerHTML=a.map(x=>`<tr><td>${x.username}</td><td>${x.email}</td><td>${x.coins}</td><td>${x.referral_code}</td><td>${x.blocked?"Blok":"Faol"}</td><td><input id=c${x.id} type=number style="width:75px"><button onclick=coin(${x.id})>Qo‘llash</button></td><td><button onclick=block(${x.id},${!x.blocked})>${x.blocked?"Ochish":"Bloklash"}</button></td></tr>`).join("")}async function coin(i){let a=+document.getElementById("c"+i).value;await A("/api/admin/users/"+i+"/coins",{method:"POST",body:JSON.stringify({amount:a})});open()}async function block(i,b){await A("/api/admin/users/"+i+"/block",{method:"POST",body:JSON.stringify({blocked:b})});open()}async function logout(){await A("/api/admin/logout",{method:"POST"});location.reload()}</script></body></html>
